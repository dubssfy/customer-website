<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Blue gradient for top panel -->
    <linearGradient id="favBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <!-- Cyan water gradient -->
    <linearGradient id="favWaterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>
  <!-- Washing machine body -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#favBlueGrad)" />

  <!-- Top control panel lighter area -->
  <rect x="5" y="5" width="90" height="28" rx="20" fill="#1E3A8A" />
  <rect x="5" y="22" width="90" height="11" fill="#1E3A8A" />

  <!-- Control buttons -->
  <circle cx="20" cy="18" r="4" fill="#FCD34D" />
  <circle cx="33" cy="18" r="2.5" fill="#60A5FA" />
  <!-- Dial -->
  <circle cx="78" cy="18" r="6" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" />
  <line x1="78" y1="18" x2="78" y2="14" stroke="white" stroke-width="1.5" stroke-linecap="round" />

  <!-- Machine body white area -->
  <rect x="5" y="28" width="90" height="67" fill="white" rx="0" />
  <rect x="5" y="85" width="90" height="10" rx="0" fill="white" />
  <rect x="5" y="88" width="90" height="7" rx="18" fill="white" />

  <!-- Drum glass door -->
  <circle cx="50" cy="62" r="25" fill="white" stroke="url(#favBlueGrad)" stroke-width="5" />
  <circle cx="50" cy="62" r="19" fill="none" stroke="#DBEAFE" stroke-width="1.5" />

  <!-- Water inside drum -->
  <clipPath id="favDrumClip">
    <circle cx="50" cy="62" r="19" />
  </clipPath>
  <g clip-path="url(#favDrumClip)">
    <ellipse cx="50" cy="70" rx="22" ry="13" fill="url(#favWaterGrad)" opacity="0.8" />
    <path d="M 34 57 C 41 49, 59 49, 66 57 C 59 64, 41 64, 34 57" fill="#FCD34D" opacity="0.7" />
  </g>

  <!-- Sparkle -->
  <path d="M 79 38 L 81 42 L 85 44 L 81 46 L 79 50 L 77 46 L 73 44 L 77 42 Z" fill="#FCD34D" />
</svg>